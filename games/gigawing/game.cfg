# Giga Wing (Capcom/Takumi 1999, CPS-2 arcade board): per-game settings read by the cps2recomp
# toolkit (Makefile, tools and launcher via cps2recomp/tools/gamecfg.py).

name = Giga Wing
# What the window is called (the name stays the folder the player's settings are kept under)
title = Giga Wing Recomp
id = gigawing
# Reverse-DNS app identifier (macOS bundle id / launcher).
app_id = io.github.omegakatana92.gigawing
disclaimer = Not affiliated with Capcom.

# The ROM set this port is made from, as arcade ROM collections name it, and the name the launcher shows.
# `gigawing` is MAME's parent set (USA 990222); its clones (gigawingj, gigawinga, gigawingb, gigawingc,
# gigawingd, gigawing1) are built from the same board and are not accepted.
rom_set = gigawing
rom_parent = gigawing
rom_name = Giga Wing (USA 990222)

# The set's files, each with its CRC32 (file:crc ...), in the order they sit on the board.
# program: the 68000's ROMs (16-bit words, three 512 KiB files: 1.5 MiB of the board's 4 MiB code region).
# graphics: four files side by side per row (64-bit words), ggw.13m/15m/17m/19m, 4 MiB each (16 MiB).
# sound_program: the Z80's ROM (ggw.01); its first 32 KiB are mapped and the rest are banked.
# samples: the QSound chip's (ggw.11m, ggw.12m, 8 MiB). key: the board's cipher key.
program = ggwu.03:ac725eb2 ggwu.04:392f4118 ggw.05:3239d642
graphics = ggw.13m:105530a4 ggw.15m:9e774ab9 ggw.17m:466e0ba4 ggw.19m:840c8dea
sound_program = ggw.01:4c6351d5
samples = ggw.11m:e172acf5 ggw.12m:4bee4e8f
key = gigawing.key:5076c26b

# Where the game's code ends in the 68000's ROM (hex): the translator does not look past this. The three
# program ROMs fill the first 1.5 MiB of the board's 4 MiB code region, so the code ends at 0x180000.
code_end = 180000
